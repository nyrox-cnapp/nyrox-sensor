# One image at one tag, from this repository's main: what Nyrox's build
# script (monorepo build-push.sh) starts after pushing the same tag to its
# own registry, once it has synced images/<image> here. amd64 + arm64,
# signed with cosign keyless signing like the release images.
#
# An existing tag is never overwritten: a published tag is what someone may
# already run, and its signature names that image.
name: publish-image

on:
  workflow_dispatch:
    inputs:
      image:
        description: "runtime-sensor or sensor-forwarder"
        required: true
        type: choice
        options: [runtime-sensor, sensor-forwarder]
      tag:
        description: "Image tag, e.g. v1.0.1"
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write # cosign keyless signing

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Tag looks like vX.Y.Z
        env:
          TAG: ${{ inputs.tag }}
          NAME: ${{ inputs.image }}
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "bad tag: $TAG"; exit 1; }
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/$OWNER/nyrox-$NAME" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag not published yet
        run: |
          if docker manifest inspect "$IMAGE:$TAG" >/dev/null 2>&1; then
            echo "$IMAGE:$TAG already exists; not overwriting it"; exit 1
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: images/${{ inputs.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes "$IMAGE@${{ steps.build.outputs.digest }}"
