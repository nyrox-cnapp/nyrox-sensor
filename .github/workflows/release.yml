# On a tag vX.Y.Z: both images (amd64 + arm64) to ghcr.io, signed with
# cosign keyless signing, and the chart as an OCI artifact. The tag must
# match the image tags in charts/nyrox-sensor/values.yaml.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write # cosign keyless signing

jobs:
  images:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [runtime-sensor, sensor-forwarder]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: images/${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/nyrox-${{ matrix.image }}:${{ github.ref_name }}
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes "ghcr.io/${{ github.repository_owner }}/nyrox-${{ matrix.image }}@${{ steps.build.outputs.digest }}"

  chart:
    needs: images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Chart version matches the tag
        run: |
          v=$(grep '^version:' charts/nyrox-sensor/Chart.yaml | awk '{print $2}')
          test "v$v" = "${{ github.ref_name }}" || { echo "Chart.yaml version $v != tag ${{ github.ref_name }}"; exit 1; }
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: helm package charts/nyrox-sensor
      - run: helm push nyrox-sensor-*.tgz "oci://ghcr.io/${{ github.repository_owner }}/charts"
