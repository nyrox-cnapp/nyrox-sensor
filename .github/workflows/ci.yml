name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  chart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - run: helm lint charts/nyrox-sensor
      - run: helm template nyrox-sensor charts/nyrox-sensor -n nyrox-sensor > /dev/null

  images:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [runtime-sensor, sensor-forwarder]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: images/${{ matrix.image }}
          push: false
